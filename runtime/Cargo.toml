[package]
name = "arcadia-framework"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["macros", "parsing"] }
tokio = { version = "1", features = ["net", "signal"] }
tracing = "0.1"
utoipa = "6.0.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }

[dev-dependencies]
arcadia-macros = { path = "../macros" }
tower = { version = "0.5", features = ["util"] }
