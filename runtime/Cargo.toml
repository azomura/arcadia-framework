[package]
name = "arcadia-framework"
version = "0.1.8"
edition = "2024"
description = "A NestJS-inspired modular backend framework for Rust"
license = "MIT"
repository = "https://github.com/azomura/arcadia-framework"
documentation = "https://docs.rs/arcadia-framework"
readme = "README.md"
keywords = ["rust", "backend", "framework", "dependency-injection"]
categories = ["web-programming::http-server", "web-programming"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["macros", "parsing"] }
tokio = { version = "1", features = ["net", "signal", "sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "fmt"] }
utoipa = "6.0.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }

[dev-dependencies]
arcadia-macros = { path = "../macros" }
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "application_basic"
path = "tests/application/basic.rs"

[[test]]
name = "application_container"
path = "tests/application/container.rs"

