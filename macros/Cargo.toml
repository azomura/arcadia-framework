[package]
name = "arcadia-macros"
version = "0.1.6"
edition = "2024"
description = "Procedural macros for the Arcadia Rust backend framework"
license = "MIT"
repository = "https://github.com/azomura/arcadia-framework"
documentation = "https://docs.rs/arcadia-macros"
readme = "README.md"
keywords = ["rust", "procedural-macro", "framework", "backend"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3.0.10", features = ["full"] }
