name: Publish Cargo release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cargo-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0

      - name: Check and bump package versions
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          paths = [Path("runtime/Cargo.toml"), Path("macros/Cargo.toml")]

          def version(text: str) -> str:
              return re.search(r'^version = "([^"]+)"$', text, re.MULTILINE).group(1)

          current = [version(path.read_text()) for path in paths]
          previous = [
              version(subprocess.check_output(["git", "show", f"HEAD^:{path}"], text=True))
              for path in paths
          ]
          if len(set(current)) != 1:
              raise SystemExit(f"Package versions must match: {current}")

          current_version = current[0]
          if current == previous:
              major, minor, patch = map(int, current_version.split("."))
              if patch < 9:
                  patch += 1
              else:
                  minor += 1
                  patch = 0
              next_version = f"{major}.{minor}.{patch}"
              for path in paths:
                  text = path.read_text()
                  path.write_text(text.replace(
                      f'version = "{current_version}"',
                      f'version = "{next_version}"',
                      1,
                  ))
              current_version = next_version
              bumped = "true"
          else:
              bumped = "false"

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={current_version}\n")
              output.write(f"bumped={bumped}\n")
          PY

      - name: Validate workspace
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit automatic version bump
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo check --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/Cargo.toml macros/Cargo.toml Cargo.lock
          git commit -m "chore(release): bump crates to v${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Publish procedural macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p arcadia-macros

      - name: Publish runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p arcadia-framework

      - name: Create release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --verify-tag \
            --title "Arcadia Framework v${VERSION}" \
            --generate-notes
